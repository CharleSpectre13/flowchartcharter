# FlowChartCharter continuous audit — Pepe standards
# pyflakes · pycodestyle · black --check · example test suite
name: Continuous Audit Loop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  audit:
    name: Pepe Audit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt

      - name: pycodestyle
        run: |
          python -m pycodestyle \
            --max-line-length=100 \
            --ignore=E203,W503,E501,E704 \
            packages/core/flowchartcharter

      - name: pyflakes
        run: |
          python -m pyflakes packages/core/flowchartcharter

      - name: black --check
        run: |
          python -m black --check --line-length=100 --target-version py310 packages/core/flowchartcharter

      - name: compileall
        run: |
          python -m compileall -q packages/core/flowchartcharter

      - name: Example suite (pytest-compatible scripts)
        env:
          PYTHONPATH: packages/core
          FCC_LIVE_WIRE: "1"
          FCC_LLM_PROVIDER: mock
        run: |
          set -e
          for t in \
            examples/test_playbook_compiler.py \
            examples/test_api_server.py \
            examples/test_production_integration.py \
            examples/test_phase2_sandbox.py \
            examples/test_analytics_protocol.py \
            examples/test_living_playbook.py
          do
            if [ -f "$t" ]; then
              echo "==> $t"
              python "$t"
            fi
          done

      - name: Continuous audit_loop script
        env:
          PYTHONPATH: packages/core
        run: |
          if [ -f scripts/audit_loop.py ]; then
            python scripts/audit_loop.py \
              --tests examples/test_playbook_compiler.py examples/test_api_server.py \
              --targets \
                packages/core/flowchartcharter/playbook_compiler.py \
                packages/core/flowchartcharter/api_server.py \
                packages/core/flowchartcharter/production.py \
                packages/core/flowchartcharter/system.py
          fi

  package:
    name: Build sdist/wheel
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
