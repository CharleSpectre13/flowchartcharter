# Build & push flowchart-charter-engine to Docker Hub
# Secrets required:
#   DOCKERHUB_USERNAME  e.g. charlespectre
#   DOCKERHUB_TOKEN     Docker Hub Access Token (not password)
#
# Trigger: Actions → Docker Hub Publish → Run workflow
# Or: publish a GitHub Release
name: Docker Hub Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: package version from pyproject)"
        required: false
        default: ""
      latest:
        description: "Also tag as latest"
        required: false
        default: "true"

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pyproject.toml
        id: ver
        run: |
          V=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/flowchart-charter-engine
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event.inputs.latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ secrets.DOCKERHUB_USERNAME }}/flowchart-charter-engine\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.ver.outputs.tag }}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hub: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/flowchart-charter-engine" >> "$GITHUB_STEP_SUMMARY"
