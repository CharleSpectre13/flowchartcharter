# Build & push flowchart-charter-engine to Docker Hub
# Preferred: repository secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
# One-shot (phone): workflow_dispatch inputs username + token
name: Docker Hub Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: pyproject version)"
        required: false
        default: "1.6.1"
      latest:
        description: "Also tag as latest"
        required: false
        default: "true"
      username:
        description: "Docker Hub username (optional if secret set)"
        required: false
        default: ""
      token:
        description: "Docker Hub access token (optional if secret set)"
        required: false
        default: ""

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve credentials
        id: creds
        env:
          SECRET_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SECRET_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INPUT_USER: ${{ github.event.inputs.username }}
          INPUT_TOKEN: ${{ github.event.inputs.token }}
        run: |
          U="${INPUT_USER:-$SECRET_USER}"
          T="${INPUT_TOKEN:-$SECRET_TOKEN}"
          if [ -z "$U" ] || [ -z "$T" ]; then
            echo "Missing Docker Hub credentials. Set secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN or pass username+token inputs."
            exit 1
          fi
          echo "username=$U" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$T"
          {
            echo "token<<EOF"
            echo "$T"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Read version from pyproject.toml
        id: ver
        run: |
          V=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.creds.outputs.username }}
          password: ${{ steps.creds.outputs.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.creds.outputs.username }}/flowchart-charter-engine
          tags: |
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event.inputs.latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.creds.outputs.username }}/flowchart-charter-engine\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: \`${{ steps.ver.outputs.tag }}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hub: https://hub.docker.com/r/${{ steps.creds.outputs.username }}/flowchart-charter-engine" >> "$GITHUB_STEP_SUMMARY"
