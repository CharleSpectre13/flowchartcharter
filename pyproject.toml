[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchart-charter-engine"
version = "1.3.1"
description = "FlowChartCharter — execution-first multi-agent state-chart engine (TPC, Muscle-Memory, Analytics Chief, API Nervous System)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CharleSpectre13" }]
keywords = [
  "agents",
  "flowchart",
  "state-machine",
  "muscle-memory",
  "graphrag-alternative",
  "fastapi",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pycodestyle>=2.11", "pyflakes>=3.2"]

[project.scripts]
flowchartcharter = "flowchartcharter.api_server:main"
fcc-sandbox = "flowchartcharter.simulation_sandbox:run_phase2_sandbox"

[project.urls]
Homepage = "https://github.com/CharleSpectre13/flowchartcharter"
Repository = "https://github.com/CharleSpectre13/flowchartcharter"

[tool.setuptools.packages.find]
where = ["packages/core"]
include = ["flowchartcharter*"]
