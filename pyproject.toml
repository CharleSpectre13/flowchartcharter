[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowchart-charter-engine"
version = "3.4.0"
description = "Accountable house: Charter + harness + optional Grok/Ollama. No key required."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "CharleSpectre13", email = "charlespectre13@gmail.com" },
]
maintainers = [
  { name = "CharleSpectre13" },
]
keywords = [
  "agents",
  "multi-agent",
  "flowchart",
  "charterfile",
  "state-machine",
  "muscle-memory",
  "graphrag",
  "hybrid-router",
  "multi-hop",
  "fastapi",
  "orchestration",
  "tpc",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "prometheus_client>=0.20.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pycodestyle>=2.11",
  "pyflakes>=3.2",
  "pytest>=8.0",
  "black>=24.0",
  "build>=1.0",
  "twine>=5.0",
]
vector = [
  # Optional SDK clients — REST backends work without these
  "qdrant-client>=1.9.0",
]
all = [
  "flowchart-charter-engine[dev,vector]",
]

[project.scripts]
flowchartcharter = "flowchartcharter.api_server:main"
fcc = "flowchartcharter.fcc_cli:run"
fcc-sandbox = "flowchartcharter.simulation_sandbox:run_phase2_sandbox"
fcc-audit = "flowchartcharter.cli:audit_main"

[tool.setuptools]
package-dir = {"" = "packages/core"}

[tool.setuptools.packages.find]
where = ["packages/core"]
include = ["flowchartcharter*"]

[project.urls]
Homepage = "https://github.com/CharleSpectre13/flowchartcharter"
Documentation = "https://github.com/CharleSpectre13/flowchartcharter#readme"
Repository = "https://github.com/CharleSpectre13/flowchartcharter"
